[workspace]
resolver = "3"
members = ["crates/lumina", "crates/lumina-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Checked in CI (msrv job); raise deliberately, never by accident.
# 1.88: slice::as_chunks
rust-version = "1.88"
authors = ["wlof"]
license = "MIT"
repository = "https://github.com/wlof/lumina"
keywords = ["klipsch", "speakers", "usb", "hid", "audio"]
categories = ["hardware-support", "command-line-utilities"]

[workspace.dependencies]
lumina = { path = "crates/lumina", version = "0.1.0" }
# linux-static-libusb: interface 4 has no hidraw node on Linux. Other platforms
# use their native back end (libusb via the system hidapi on FreeBSD).
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-libusb"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that hurt more than they help here
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# A few restriction lints worth having
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
