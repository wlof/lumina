[package]
name = "klipsch-lumina-cli"
description = "Command line control for Klipsch ProMedia Lumina speakers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "lumina"
path = "src/main.rs"

[dependencies]
klipsch-lumina = { workspace = true, features = ["serde"] }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
klipsch-lumina = { workspace = true, features = ["serde", "sim"] }

[lints]
workspace = true

[package.metadata.dist]
# Linux users need the udev rule to access the speakers
include = ["../../udev/60-klipsch-lumina.rules"]
