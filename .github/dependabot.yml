version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before adopting them
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    # Generated by `dist generate`; its pins live in dist-workspace.toml
    exclude-paths: [".github/workflows/release.yml"]
    schedule:
      interval: weekly
    # Let new releases age before adopting them
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
