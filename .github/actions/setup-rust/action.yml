name: Set up Rust
description: Install the toolchain pinned in rust-toolchain.toml, the libusb headers on Linux, and the build cache

inputs:
  toolchain:
    description: Toolchain to install instead of the pinned one (e.g. the MSRV)
    required: false
    default: ""
  cache-key:
    description: Extra key for the build cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install libusb headers
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config

    - name: Install Rust
      shell: bash
      run: |
        toolchain="${{ inputs.toolchain }}"
        if [ -z "$toolchain" ]; then
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
        fi
        rustup toolchain install "$toolchain" --profile minimal \
          --component rustfmt,clippy,llvm-tools-preview
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
        rustc --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
